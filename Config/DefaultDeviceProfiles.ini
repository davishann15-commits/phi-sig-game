[Mac DeviceProfile]
; Keep Lumen's indirect light while avoiding costly hardware scene tracing
; in the furnished house. Tested on the project's Apple Silicon Mac.
+CVars=r.Lumen.HardwareRayTracing=0
; Restore the original warm interior fill with software-traced Lumen.
+CVars=r.SkylightIntensityMultiplier=1.3
; Avoid expensive coarse-page rendering of the imported non-Nanite house.
+CVars=r.Shadow.Virtual.NonNanite.IncludeInCoarsePages=0
; Local-light shadow pages at half resolution: the furnished house has ~30 shadow-casting lights and the
; soft interior shadows do not need full-resolution pages on the laptop GPU.
+CVars=r.Shadow.Virtual.ResolutionLodBiasLocal=1.0
